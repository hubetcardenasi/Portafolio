<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor Pro</title>
  <link rel="stylesheet" href="editor-pro-css/style.css">
</head>
<body class="layout">

  <header class="topbar">
    <button id="toggleSidebar">☰</button>
    <h1>Editor&nbsp;Pro</h1>
    <button id="toggleTheme">🌙</button>
  </header>

  <div class="sidebar" id="sidebar">

    <h3>Herramientas</h3>
    <div class="tool" draggable="true" data-type="rect">⬛ Rectángulo</div>
    <div class="tool" draggable="true" data-type="circle">⚪ Círculo</div>
    <div class="tool" draggable="true" data-type="text">🔤 Texto</div>
    <div class="tool" draggable="true" data-type="line">／ Línea</div>
    <div class="tool" draggable="true" data-type="arrow">➤ Flecha</div>
    <div class="tool" draggable="true" data-type="polygon">🔺 Polígono</div>
    <div class="tool" draggable="true" data-type="image">🖼 Imagen (URL)</div>
    
    <h3>UI / Prótesis</h3>
    <div class="tool" draggable="true" data-type="ui-button">🔘 Botón UI</div>
    <div class="tool" draggable="true" data-type="ui-card">🗂 Tarjeta UI</div>
    <div class="tool" draggable="true" data-type="sensor-node">🟢 Nodo sensor</div>
    <div class="tool" draggable="true" data-type="actuator-node">🟠 Nodo actuador</div>

    <h3>Acciones</h3>
    <button id="btnDelete">Eliminar seleccionado</button>
    <button id="btnDuplicate">Duplicar</button>
    <button id="btnBringFront">Al frente</button>
    <button id="btnSendBack">Al fondo</button>
  
    <h3>Proyecto</h3>
    <button id="btnSaveProject">Guardar JSON</button>
    <input type="file" id="loadProject" accept="application/json">

    <h3>Exportar</h3>
    <button id="btnExportPNG">Exportar PNG</button>
    <button id="btnExportSVG">Exportar SVG</button>

    <h3>Imágenes</h3>
    <input type="file" id="imageLoader" accept="image/*">

    <!-- PANEL DE CONFIGURACIÓN DE GRID -->
    <h3>Configuración de Grid</h3>
    <div class="grid-config">
      <label>
        Tamaño base:
        <input type="number" id="gridSizeInput" value="20" min="5" max="200">
      </label>

      <label>
        Subdivisiones:
        <input type="number" id="gridSubInput" value="5" min="1" max="20">
      </label>

      <label>
        Color del grid:
        <input type="color" id="gridColorInput" value="#dddddd">
      </label>

      <button id="gridModeNormal">Normal</button>
      <button id="gridModeFigma">Figma</button>
      <button id="gridModeIso">Isométrico</button>
      <button id="gridModeBlueprint">Blueprint</button>
      <button id="gridMode3D">3D</button>
      <button id="toggle3D">Simulación 3D</button>
      <button id="gridToggle">Mostrar / Ocultar</button>
    </div>

  </div>

  <main class="main-area">
    <div class="canvas-wrapper">
      <div id="guidesOverlay"></div>
      <div id="selectionOverlay"></div>

      <svg id="canvas" preserveAspectRatio="xMidYMid meet">
        <defs></defs>
        <rect id="grid-background" width="100%" height="100%" fill="transparent"></rect>
      </svg>
    </div>
  </main>

  <aside class="right-panel" id="rightPanel">
    <div class="panel-section">
      <h3>Capas</h3>
      <ul id="layerList"></ul>
    </div>

    <div class="panel-section">
      <h3>Mini-mapa</h3>
      <div id="minimapContainer">
        <svg id="minimap"></svg>
      </div>
    </div>

    <div class="panel-section">
      <h3>Propiedades</h3>
      <label>
        Color relleno:
        <input type="color" id="propFill" value="#3498db">
      </label>
      <label>
        Color borde:
        <input type="color" id="propStroke" value="#000000">
      </label>
      <label>
        Grosor borde:
        <input type="number" id="propStrokeWidth" min="0" max="20" value="1">
      </label>
      <label>
        Tamaño texto:
        <input type="number" id="propFontSize" min="8" max="80" value="24">
      </label>
      <label>
        Rotación (°):
        <input type="number" id="propRotation" value="0">
      </label>
    </div>
  </aside>

  <script type="module" src="editor-pro-js/main.js"></script>
</body>
</html>
