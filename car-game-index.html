<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carro Evade Obstáculos - Avanzado</title>
    <link rel="stylesheet" href="car-game-css/style.css">
</head>
<body>

    <!-- Menú inicial animado -->
    <div id="startScreen" class="overlay">
        <div class="start-content">
            <h1 class="title-anim">Carro Evade Obstáculos</h1>

            <p>Elige tu skin:</p>
            <div class="skin-options">
                <label>
                    <input type="radio" name="skin" value="skin-blue" data-skin-id="blue" checked>
                    Azul (base)
                </label>
                <label>
                    <input type="radio" name="skin" value="skin-green" data-skin-id="green">
                    Verde (HighScore ≥ 50)
                </label>
                <label>
                    <input type="radio" name="skin" value="skin-red" data-skin-id="red">
                    Rojo (HighScore ≥ 100)
                </label>
            </div>
            <p id="skinsLockInfo" class="hint"></p>

            <p>Sensibilidad del swipe:</p>
            <input id="swipeSensitivity" type="range" min="10" max="120" value="40">

            <p>Modo zurdo:</p>
            <label><input type="checkbox" id="leftHandMode"> Controles a la izquierda</label>

            <div id="missionsPanel">
                <h3>Misiones diarias</h3>
                <p id="missionText"></p>
                <p id="missionStatus" class="hint"></p>
            </div>

            <button id="btnStart">Iniciar</button>
            <p class="hint">Usa ← →, botones, swipe, doble tap (turbo) y pulsación prolongada (escudo).</p>
        </div>
    </div>

    <!-- Overlay Game Over -->
    <div id="gameOverScreen" class="overlay hidden">
        <div class="start-content">
            <h2>Game Over</h2>
            <p id="finalScoreText"></p>
            <p id="finalHighScoreText"></p>
            <button id="btnRestart">Reintentar</button>
        </div>
    </div>

    <!-- Área de juego -->
    <div id="gameArea">
        <div id="hud">
            <div class="hud-item">Puntos: <span id="scoreValue">0</span></div>
            <div class="hud-item">High Score: <span id="highScoreValue">0</span></div>
            <div class="hud-item">Vidas: <span id="livesValue">3</span></div>
            <div class="hud-item">Boost: <span id="boostValue">Ninguno</span></div>
        </div>

        <!-- Barra de energía -->
        <div id="energyBar">
            <div id="energyBarInner"></div>
            <span id="energyText">Energía: 100%</span>
        </div>

        <!-- Partículas -->
        <div id="particlesLayer"></div>

        <div id="car" class="skin-blue"></div>
    </div>

    <!-- Controles táctiles inferiores -->
    <div id="bottomControls">
        <button id="btnLeft" class="ctrl-btn">◀</button>
        <button id="btnBrake" class="ctrl-btn brake">⧗</button>
        <button id="btnJump" class="ctrl-btn jump">⤒</button>
        <button id="btnRight" class="ctrl-btn">▶</button>
    </div>

    <script type="module" src="car-game-js/main.js"></script>
</body>
</html>
